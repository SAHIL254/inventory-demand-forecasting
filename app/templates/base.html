<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Inventory Demand Forecasting{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"/>
</head>
<body>

<nav>
  <a class="brand" href="/">Inventory Forecast</a>
  <div class="nav-links">
    <a href="/predict">Single</a>
    <a href="/predict/batch">Batch</a>
    <a href="/predict/multi">Multi-Step</a>
  </div>
</nav>

<div class="container">

  {% if flash_msg %}
    <ul class="flash-list">
      <li class="flash-{{ flash_cat }}">{{ flash_msg | safe }}</li>
    </ul>
  {% endif %}

  {% block content %}{% endblock %}

</div>

</body>
</html>
